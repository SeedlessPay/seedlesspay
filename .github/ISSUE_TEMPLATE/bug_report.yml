name: Bug report
description: Something in SeedlessPay is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security issues, do not use this form. Follow SECURITY.md instead.
        Never share a seed phrase, private key or passkey.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Freelancer app (/app)
        - Client payment page (/pay)
        - Website or blog
        - Smart contract
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari / Windows 11, Chrome
  - type: input
    id: tx
    attributes:
      label: Transaction hash (optional)
      placeholder: 0x...
  - type: textarea
    id: screens
    attributes:
      label: Screenshots (optional)
